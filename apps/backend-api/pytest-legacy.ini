# Прежний набор на SQLAlchemy. В боевую поставку не входит и по умолчанию
# не запускается: `pytest` без ключей должен прогонять то, что работает
# в бою, иначе зелёный результат ничего не говорит об активном коде.
#
#     pip install -r requirements-legacy.txt
#     TEST_DATABASE_URL=... pytest -c pytest-legacy.ini
[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
