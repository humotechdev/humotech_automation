# Раздача собранной HR CRM (образ apps/hr-crm/Dockerfile).
#
# Снаружи сюда приходит только Caddy: /api/* он направляет на шлюз, всё
# остальное — сюда. Порт наружу не публикуется.
#
# Заголовки безопасности заданы в каждом location намеренно: `add_header`
# внутри location отменяет всё, что объявлено уровнем выше. HSTS ставит
# Caddy (TLS заканчивается на нём).

# Политика содержимого CRM.
#
# - script-src: свой код и Google Maps JS (подгружает скрипты с
#   *.googleapis.com / *.gstatic.com), если задан VITE_GOOGLE_MAPS_KEY;
# - img-src: плитки OpenStreetMap (карта офиса без ключа Google), картинки
#   Google Maps, data:/blob: — QR-коды точек и предпросмотр фотографии;
# - connect-src: свой API, поиск адреса photon.komoot.io, Google Maps;
# - frame-ancestors 'none' + X-Frame-Options DENY: CRM во фрейме не нужна
#   никому, а фрейм — это кликджекинг по кнопкам «одобрить» и «удалить».
map $host $crm_csp {
    default "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://photon.komoot.io https://*.googleapis.com https://*.google.com https://*.gstatic.com; worker-src 'self' blob:; frame-src 'self' https://*.google.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /crm-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Маршрутизация на клиенте: прямая ссылка на экран CRM отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $crm_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $crm_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    }

    # Имена собранных файлов содержат хеш: кэш надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # Django Admin через CRM-домен недоступен: Caddy шлёт на шлюз только
    # /api/*, а /admin сюда приходит как обычный SPA-маршрут (CRM сама
    # переводит его на /administration). Отдельный location для /admin
    # здесь ставить НЕЛЬЗЯ: префикс /admin совпал бы и с /administration.

    location ~ /\. {
        deny all;
    }
}
