# Локальное окружение HUMOTECH.
#
# Запуск из корня репозитория:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Порт базы этим файлом НЕ публикуется: опубликованный без адреса порт
# Docker открывает на всех интерфейсах, и база с паролем оказывалась
# доступна из любой сети, куда подключён ноутбук. Доступ с хоста
# (127.0.0.1:5433) даёт надстройка docker-compose.local.yml.
#
# Пароль базы — только из окружения (infrastructure/docker/.env,
# POSTGRES_PASSWORD). Умолчания нет: пароль, записанный в файле из Git,
# известен всем, у кого есть репозиторий.

services:
  postgres:
    # Официальный образ pgvector поверх PostgreSQL 18: расширение vector уже внутри,
    # ставить его в систему вручную не нужно.
    image: pgvector/pgvector:pg18
    container_name: humotech_postgres
    environment:
      POSTGRES_USER: humotech
      # Читается только при создании тома: на существующих данных пароль
      # уже записан в базе, и смена переменной его не меняет.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в infrastructure/docker/.env}
      POSTGRES_DB: humotech
      # ускоряет первый старт и делает сравнение строк предсказуемым
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # В образах PostgreSQL 18+ том монтируется в /var/lib/postgresql, а НЕ
      # в /var/lib/postgresql/data: с 18-й версии данные лежат в подкаталоге
      # с номером мажорной версии, чтобы работал pg_upgrade --link.
      # Старый путь /data приводит к отказу старта с ошибкой
      # "in 18+, these Docker images are configured to store database data in a
      #  format which is compatible with pg_ctlcluster".
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # без этого миграции стартуют раньше, чем сервер готов принимать соединения
      test: ["CMD-SHELL", "pg_isready -U humotech -d humotech"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
