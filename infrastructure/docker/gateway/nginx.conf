# Обратный прокси HUMOTECH: один публичный origin на всё.
#
# Снаружи существует ровно один адрес — постоянный домен ngrok. С него
# приходит и Mini App, и API. Поэтому браузер не видит межсайтового
# запроса: CORS в этой схеме не участвует, и открывать зоны в
# `TELEGRAM_MINI_APP_ALLOWED_ORIGINS` не нужно — умолчание остаётся
# закрытым, как и задумано в humotech/core/cors.py.
#
# Внутрь Docker-сети смотрит только агент ngrok. Наружу этот порт не
# публикуется: PostgreSQL, бот и рабочие процессы недостижимы ни по
# какому пути отсюда.

# --- адрес клиента ------------------------------------------------------------
#
# X-Forwarded-For принимается ТОЛЬКО от внешнего прокси (ngrok, Caddy), и из
# него берётся одна запись — самая правая, то есть поставленная этим
# прокси. Всё, что левее, написал клиент, и верить этому нельзя: иначе
# заголовок «X-Forwarded-For: 6.6.6.6» подменял адрес в журнале аудита,
# обходил ограничение частоты запросов и проверку офисной сети.
#
# Список доверенных прокси (`set_real_ip_from`) пишет скрипт
# 40-humotech-gateway.sh из переменной GATEWAY_TRUSTED_PROXIES. Подключение
# по маске намеренно: нет файла — nginx стартует всё равно, просто не
# верит заголовку никому. Отказ в закрытую сторону, а не падение шлюза.
#
# Дальше backend получает X-Forwarded-For ПЕРЕЗАПИСАННЫМ — ровно один
# адрес ($remote_addr после этого разбора), см. proxy-headers.inc. Поэтому
# у backend TRUSTED_PROXY_COUNT=1 (и NUM_PROXIES у DRF тоже 1).
include /etc/nginx/humotech/real-ip*.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Протокол исходного запроса. ngrok терминирует TLS и присылает
# X-Forwarded-Proto; если заголовка нет — снаружи он мог прийти только
# по HTTPS, потому что другого входа не существует.
#
# Django с SECURE_SSL_REDIRECT=True без этого заголовка отвечает
# редиректом на себя же, и в Telegram WebView это выглядит как
# бесконечная загрузка — то есть ровно как поломка.
#
# Заголовок от клиента здесь принимается как есть, и это осознанно: порт
# шлюза наружу не публикуется, снаружи до него доходит только внешний
# прокси, а тот (ngrok, Caddy) выставляет X-Forwarded-Proto сам.
# Публиковать порт шлюза нельзя — вместе с этим пропала бы и эта гарантия,
# и гарантия X-Forwarded-For выше.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# HSTS — только когда снаружи действительно TLS. Пустое значение nginx
# не отправляет вовсе.
map $forwarded_proto $hsts_header {
    https   "max-age=31536000";
    default "";
}

# Политика содержимого Mini App.
#
# - script-src: свой код и telegram-web-app.js с telegram.org — без него
#   нет window.Telegram.WebApp и подписанной строки запуска;
# - style-src 'unsafe-inline': React и скрипт Telegram ставят стили
#   элементам и CSS-переменные темы;
# - img-src data:/blob:: предпросмотр фотографии справки перед отправкой;
# - frame-ancestors: web.telegram.org открывает Mini App во фрейме, поэтому
#   X-Frame-Options здесь НЕТ (DENY сломал бы веб-версию Telegram), а
#   встраивание разрешено только Telegram;
# - камера и геопозиция НЕ ограничиваются: на них держится отметка.
map $host $miniapp_csp {
    default "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org";
}

# Адрес backend разрешается на КАЖДЫЙ запрос, а не один раз при старте.
#
# Это не оптимизация, а исправление настоящей поломки. nginx с обычным
# `upstream` резолвит имя однажды и запоминает адрес навсегда. Docker
# при пересоздании контейнера выдаёт новый IP — и шлюз продолжает
# стучаться по старому, отвечая 502 на всё: Mini App, API и очередь
# уведомлений бота. Снаружи это выглядит как «стенд сломался после
# обновления», а лечится перезапуском nginx, о котором надо догадаться.
#
# 127.0.0.11 — встроенный DNS Docker, он есть в каждой сети compose.
# `valid=10s` ограничивает срок кэша: переезд контейнера подхватывается
# за десять секунд без вмешательства.
resolver 127.0.0.11 valid=10s ipv6=off;

# Адрес обязан быть ПЕРЕМЕННОЙ: только тогда nginx откладывает
# разрешение имени до запроса. Записанный строкой, он снова стал бы
# разовым, сколько бы resolver ни был настроен.
map $host $backend_origin {
    default http://backend:8000;
}

# --- запросы бота -------------------------------------------------------------
#
# Бот ходит в API с общим секретом (X-Bot-Token + X-Telegram-User-Id) и
# сообщает Telegram ID как факт. Снаружи эти заголовки и пути бота не
# нужны никому, поэтому:
#
#   - у бота свой внутренний вход — server на порту 8080 ниже. ngrok и
#     Caddy смотрят только на :80, наружу 8080 не публикуется;
#   - на :80 запрос «снаружи» узнаётся по X-Forwarded-For: его всегда
#     ставит внешний прокси (ngrok, Caddy), и клиент убрать его не может.
#     Такому запросу /api/v1/telegram/bot/ отвечает 404, а X-Bot-Token и
#     X-Telegram-User-Id вырезаются на всех путях (в том числе /api/v1/me/*,
#     где бот и Mini App делят маршруты);
#   - запрос без X-Forwarded-For на :80 — это контейнер внутри сети
#     (бот, созданный до перехода на :8080). Он продолжает работать, пока
#     compose не пересоздаст бота с BACKEND_API_URL=http://gateway:8080.
map $http_x_forwarded_for $from_edge {
    ""      0;
    default 1;
}
map $from_edge $bot_token_upstream {
    1       "";
    default $http_x_bot_token;
}
map $from_edge $bot_user_upstream {
    1       "";
    default $http_x_telegram_user_id;
}

server {
    listen 80;
    server_name _;

    # Справка о болезни — фотография с телефона, и она бывает тяжёлой.
    # Умолчание nginx в 1 МБ отклоняло бы такие загрузки с 413.
    client_max_body_size 25m;

    # Медленный клиент не держит соединение бесконечно: тело и заголовки
    # должны приходить без долгих пауз (slowloris).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Версию nginx наружу не сообщаем.
    server_tokens off;

    # Ответ приходит через туннель; ждать медленный отчёт дольше
    # умолчания приходится из-за выгрузок в XLSX.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Собственная живость прокси. Не проксируется никуда: она отвечает
    # на вопрос «жив ли nginx», а не «жив ли backend» — иначе healthcheck
    # контейнера падал бы из-за чужой болезни.
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- backend ------------------------------------------------------------
    #
    # Один блок настроек на все проксируемые пути.
    location /api/ {
        # `$request_uri` обязателен: с переменной в адресе nginx
        # перестаёт подставлять путь сам, и без него все запросы
        # ушли бы в корень.
        proxy_pass $backend_origin$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Пути бота снаружи не существуют (см. map $from_edge выше). Совпадение
    # идёт по нормализованному пути, поэтому %62ot и // сюда тоже попадают.
    location ^~ /api/v1/telegram/bot/ {
        if ($from_edge) {
            return 404;
        }
        proxy_pass $backend_origin$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Django Admin — закрытый технический интерфейс за формой входа.
    #
    # С публичного адреса он НЕ открыт: форма входа в админку — это
    # перебор паролей суперпользователя из интернета, а сама админка
    # CRM не нужна. Доступ — только с адресов из GATEWAY_ADMIN_ALLOW
    # (скрипт 40-humotech-gateway.sh пишет `allow ...;`). Пустая
    # переменная или отсутствующий файл — 403 для всех.
    location /admin/ {
        include /etc/nginx/humotech/admin-allow*.conf;
        deny all;
        proxy_pass $backend_origin$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Статика Django. Нужна только админке: Mini App свою статику
    # получает из этого же образа. Файлы кладёт сервис миграций
    # командой collectstatic в общий том.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Живость и готовность под именами из требований. Отдельных адресов
    # в Django не заводится: /healthz и /readyz уже существуют, и второй
    # маршрут с тем же смыслом — это дубль, а не совместимость.
    location = /health/live {
        proxy_pass $backend_origin/healthz;
        include /etc/nginx/conf.d/proxy-headers.inc;
        access_log off;
    }

    location = /health/ready {
        proxy_pass $backend_origin/readyz;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Приложенные файлы (справки, больничные) через веб-сервер НЕ
    # раздаются. Это решение архитектуры, а не упущение: медицинский
    # документ отдаёт view, который сначала спрашивает, кому можно.
    # Каталог лежит вне MEDIA_URL, и location для него здесь нет.

    # --- Mini App -----------------------------------------------------------
    #
    # Заголовки безопасности повторены в каждом location Mini App
    # намеренно: `add_header` внутри location отменяет все заголовки,
    # объявленные уровнем выше, и вынесенный на уровень server набор
    # молча пропадал бы там, где задан Cache-Control. На /api/ их ставит
    # Django (nosniff, X-Frame-Options, Referrer-Policy, HSTS), поэтому
    # там они не дублируются.
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Маршрутизация у приложения своя, на клиенте. Без этой строки
        # прямая ссылка на внутренний экран отдаёт 404 от nginx, хотя
        # экран существует.
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy $miniapp_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # Собранные файлы содержат хеш в имени: одно имя — одно содержимое,
    # и кэшировать их можно надолго. index.html не кэшируется никогда,
    # иначе обновление приложения не доедет до открытого Telegram.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security $hsts_header always;
        access_log off;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $miniapp_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # Скрытые файлы не отдаются никогда.
    location ~ /\. {
        deny all;
    }
}

# Внутренний вход для бота: http://gateway:8080/api/v1.
#
# Порт не публикуется и внешними прокси не используется (ngrok смотрит на
# gateway:80, Caddy — на gateway:80). Здесь только API: ни Mini App, ни
# /admin/, ни статики. X-Forwarded-Proto ставится https (map выше), иначе
# боевые настройки Django ответили бы редиректом.
server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 25m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/ {
        proxy_pass $backend_origin$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        return 404;
    }
}
